services:
  rag:
    build: .
    ports:
      - "8000:8000"
    environment:
      RAG_DATA_DIR: /app/data
      RAG_DB_DIR: /app/vector_db
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OCR_LANG: eng
    volumes:
      - ./data:/app/data
      - ./vector_db:/app/vector_db
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  ollama_models:
